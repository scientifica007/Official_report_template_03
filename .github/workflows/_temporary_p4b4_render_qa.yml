name: Temporary P4-B4 document render QA
on:
  push:
    branches:
      - feat/p4b4-printed-footer-signatures-appreciation-json
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build anonymized DOCX
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {freshCommittee,editMeta,editScore} from './prototypes/titularisation-committee/committee-engine.mjs';
          import {createCommitteeDocx} from './prototypes/titularisation-committee/docx-export.mjs';
          let s=freshCommittee();
          for(const [key,value] of Object.entries({
            rank:'أستاذ متخصص في التكوين والتعليم المهنيين من الرتبة الثانية',
            candidate:'مترشح تجريبي',institution:'مؤسسة نموذجية',date:'14 نوفمبر 2026',
            location:'مؤسسة نموذجية بئر العاتر',decision:'success',
            member1Name:'عضو أول تجريبي',member1Role:'مدير مؤسسة',
            member2Name:'عضو ثان تجريبي',member2Role:'مدير فرعي للدراسات',
            member3Name:'عضو ثالث تجريبي',member3Role:'أستاذ متخصص',
            chairName:'مفتش تجريبي',decisionPlace:'بئر العاتر',decisionDate:'22 أكتوبر 2026',
            familyName:'تجريبي',givenName:'مترشح',birth:'12 جانفي 1994 تبسة',
            occupationalBranch:'ميكانيك',examSpecialty:'ميكانيك السيارات',
            module:'صيانة المحرك',discussionTopic:'المقاربة بالكفاءات'
          }))s=editMeta(s,key,value);
          for(const [key,value] of [['g1',9],['g2',6],['g3',6],['g4',5],['g5',4]])
            s=editScore(s,'final','lesson',key,value);
          for(const [key,value] of [['d1',2],['d2',2],['d3',2],['d4',2],['d5',2],['d6',2],['d7',1]])
            s=editScore(s,'final','discussion',key,value);
          writeFileSync('p4b4-synthetic-six-page.docx',createCommitteeDocx(s));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: p4b4-render-qa
          path: p4b4-synthetic-six-page.docx
