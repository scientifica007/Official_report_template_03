name: Temporary B9 layout QA
on:
  push:
    branches: [fix/p4b9-candidate-results-and-report-folio]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate anonymized short and long Word files
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {freshCommittee,editMeta,editNote,editScore,changeMode,fillDemoMember,submit}
            from './prototypes/titularisation-committee/committee-engine.mjs';
          import {createCommitteeDocx} from './prototypes/titularisation-committee/docx-export.mjs';
          let s=freshCommittee();
          for(const [k,v] of Object.entries({
            rank:'أستاذ متخصص في التكوين والتعليم المهنيين',
            familyName:'تجريبي',givenName:'مترشح',
            candidate:'مترشح تجريبي',institution:'معهد افتراضي متخصص للتكوين',
            birth:'12 جانفي 1994 تبسة',
            location:'معهد تدريب افتراضي',
            date:'18 نوفمبر 2026',
            decisionPlace:'تبسة',decisionDate:'18 نوفمبر 2026',
            chairName:'مفتش تجريبي',
            inspectorDistrict:'المقاطعة التقنية والبيداغوجية تبسة',
            inspectorSeat:'تبسة',
            occupationalBranch:'الصيانة الصناعية',
            examSpecialty:'ميكانيك',
            qualificationLevel:'تقني سام',
            module:'مقياس تطبيقي',
            lessonTopic:'فحص مكونات المحرك',
            discussionTopic:'المقاربة بالكفاءات'
          }))s=editMeta(s,k,v);
          for(const [id,v] of Object.entries({g1:8,g2:6,g3:6,g4:5,g5:4}))
            s=editScore(s,'final','lesson',id,v);
          for(const [id,v] of Object.entries({d1:2,d2:2,d3:2,d4:2,d5:2,d6:2,d7:1}))
            s=editScore(s,'final','discussion',id,v);
          s=editNote(s,'final','general','حسن');
          writeFileSync('b9-short.docx',createCommitteeDocx(s));
          let long=changeMode(s,'individual');
          for(const who of ['chair','member1','member2','member3']){
            long=fillDemoMember(long,who);
            long=submit(long,who);
          }
          writeFileSync('b9-long.docx',createCommitteeDocx(long,{reportPageCount:8}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: b9-qa-docx
          path: b9-*.docx
