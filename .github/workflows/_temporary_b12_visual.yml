name: Temporary B12 minutes rendering check
on:
  push:
    branches: [fix/p4b12-minutes-language-layout]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble anonymized minutes and static site
        run: |
          mkdir -p qa-b12
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {freshCommittee,editMeta,editNote,stringifyCommittee}
            from './prototypes/titularisation-committee/committee-engine.mjs';
          import {createCommitteeDocx} from './prototypes/titularisation-committee/docx-export.mjs';
          let s=freshCommittee();
          const fields={
            rank:'أستاذ متخصص في التكوين والتعليم المهنيين من الرتبة الثانية',
            date:'18 نوفمبر 2026',decisionDate:'18 نوفمبر 2026',
            location:'المعهد الوطني التجريبي للتكوين المهني - تبسة',
            institution:'معهد التكوين المهني التجريبي',candidate:'المترشح التجريبي',
            familyName:'التجريبي',givenName:'المترشح',wilaya:'تبسة',
            decisionPlace:'تبسة',chairName:'المفتش التجريبي',
            member1Name:'العضو الأول التجريبي',member1Role:'مدير مؤسسة',
            member2Name:'العضو الثاني التجريبي',member2Role:'مسؤول بيداغوجي',
            member3Name:'العضو الثالث التجريبي',member3Role:'أستاذ متخصص'
          };
          for(const [k,v] of Object.entries(fields))s=editMeta(s,k,v);
          s=editNote(s,'final','general','حسن');
          writeFileSync('qa-b12/minutes-synthetic.docx',createCommitteeDocx(s,{kind:'minutes'}));
          writeFileSync('qa-b12/state.json',stringifyCommittee(s));
          NODE
          tar -czf qa-b12/site.tar.gz prototypes/titularisation-committee prototypes/titularisation-workbench
      - uses: actions/upload-artifact@v4
        with:
          name: p4b12-synthetic-visual-check
          path: qa-b12/
